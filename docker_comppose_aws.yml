services:

  user-service:
    build:
      context: .
      dockerfile: user_services/Dockerfile
    container_name: ecommerce-user-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/ecommerce_user_db
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN}

  product-service:
    build:
      context: .
      dockerfile: product_services/Dockerfile
    container_name: ecommerce-product-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/ecommerce_product_db
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: ecommerce-order-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/ecommerce_order_db
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      USER_SERVICE_URL: http://user-service:5002
      PRODUCT_SERVICE_URL: http://product-service:5001
    depends_on:
      - user-service
      - product-service

  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    environment:
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      PRODUCT_SERVICE_URL: http://product-service:5001
      USER_SERVICE_URL: http://user-service:5002
      ORDER_SERVICE_URL: http://order-service:5003
    depends_on:
      - user-service
      - product-service
      - order-service
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: front_end/Dockerfile
    container_name: ecommerce-frontend
    restart: unless-stopped
    environment:
      COGNITO_DOMAIN: ${COGNITO_DOMAIN}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI}
      COGNITO_LOGOUT_URI: ${COGNITO_LOGOUT_URI}
      COGNITO_SCOPES: ${COGNITO_SCOPES}
    depends_on:
      - api-gateway
    ports:
      - "5500:5500"
