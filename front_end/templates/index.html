<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>

    <header>

        <h1>E-Commerce Dashboard</h1>

        <p>Flask + PostgreSQL + Microservices</p>

        <div id="auth-status">Not authenticated</div>

        <button id="login-button" type="button">Login with Cognito</button>
        <button id="logout-button" type="button" hidden>Logout</button>

    </header>


    <main>

        <!-- USERS -->

        <section>

            <h2>Signed-in user</h2>
            <div id="current-user">Login to view your profile and orders.</div>

        </section>

        <section>

            <h2>Users</h2>

            <button onclick="loadUsers()">
                Refresh Users
            </button>

            <div id="users">
                Loading users...
            </div>

        </section>


        <!-- PRODUCTS -->

        <section>

            <h2>Products</h2>

            <button onclick="loadProducts()">
                Refresh Products
            </button>

            <div id="products">
                Loading products...
            </div>

        </section>


        <!-- ORDERS -->

        <section>

            <h2>Orders</h2>

            <button onclick="loadOrders()">
                Refresh Orders
            </button>

            <div id="orders">
                Login required to view your orders.
            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='auth.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>
